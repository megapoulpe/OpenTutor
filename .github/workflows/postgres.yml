name: PostgreSQL integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opentutor
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: opentutor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opentutor -d opentutor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      POSTGRES_TEST_DATABASE_URL: postgresql://opentutor:integration-only-password@127.0.0.1:5432/opentutor_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r apps/api/requirements-cloud.txt pytest pytest-asyncio pytest-cov
      - run: python -m pytest tests/test_postgres_integration.py -q -o addopts=
