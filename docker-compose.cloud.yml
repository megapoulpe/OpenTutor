name: opentutor-cloud
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opentutor
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in your local .env}
      POSTGRES_DB: opentutor
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentutor -d opentutor"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opentutor:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/opentutor
      DATABASE_SSL_MODE: disable
      APP_AUTO_CREATE_TABLES: "false"
      APP_AUTO_SEED_DEMO: "false"
      APP_RUN_ACTIVITY_ENGINE: "true"
      ACTIVITY_USE_REDIS_NOTIFY: "false"
      UPLOAD_DIR: /tmp/opentutor-uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
